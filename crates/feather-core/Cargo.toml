[package]
name = "feather-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ScanSnap network protocol, scan pipeline and PDF writer for Feather Scan"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jpeg-decoder = { version = "0.3", default-features = false }
miniz_oxide = "0.8"
jpeg-encoder = { version = "0.6", default-features = false, features = ["std"] }
libc = "0.2"
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSData", "NSDictionary", "NSError", "NSString", "NSValue", "NSRange", "NSGeometry"] }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "VNRequest", "VNRequestHandler", "VNRecognizeTextRequest", "VNObservation", "VNTypes", "objc2-image-io", "objc2-core-foundation"] }
objc2-image-io = { version = "0.3", default-features = false, features = ["std", "CGImageProperties"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
